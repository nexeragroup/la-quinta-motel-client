server {
    listen 80;
    listen [::]:80;
    server_name laquintamotel.rw;
    return 308 https://laquintamotel.rw$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.laquintamotel.rw;
    return 308 https://laquintamotel.rw$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.laquintamotel.rw;

    ssl_certificate /etc/letsencrypt/live/laquintamotel.rw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laquintamotel.rw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://laquintamotel.rw$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name laquintamotel.rw;

    ssl_certificate /etc/letsencrypt/live/laquintamotel.rw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laquintamotel.rw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ~ ^/home/?$ {
        return 301 https://laquintamotel.rw/;
    }

    location / {
        proxy_pass http://127.0.0.1:10301;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
